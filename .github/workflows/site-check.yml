# Daily health check of www.axellsdojo.com, from GitHub's servers (independent of Cloudflare): every page answers, every
# download link leads to a real release file, the Worker behind the contact form answers, the spam check and the AI policy
# are in place. A failed run is e-mailed by GitHub to the repository owner.
name: Site check
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Pages, downloads, contact form, robots.txt
        run: |
          set -u
          S=https://www.axellsdojo.com; UA="axell-site-check (github actions)"; fail=0
          bad() { echo "::error::$1"; fail=1; }
          for p in / /contact/ /privacy/ /impressum/ /credits/ /dojo/ /penta-eq/ /duo-compressor/ /gate/ /dereverb/ \
                   /velvet/ /master/ /space/ /forbidden-seal/ /76/; do
            c=$(curl -s -o /dev/null -w '%{http_code}' -A "$UA" -L "$S$p"); [ "$c" = 200 ] && echo "ok   $p" || bad "$p answered $c"
          done
          for p in /download /download/ /windows /linux /suite /github /support /support/; do
            to=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' -A "$UA" "$S$p")
            case "$to" in "302 https://github.com/zmardanian"*|"302 https://ko-fi.com/axellyobag"*) echo "ok   $p";; *) bad "$p -> '$to'";; esac
          done
          for k in dojo penta-eq duo-compressor gate dereverb velvet master space forbidden-seal 76; do
            for os in windows linux; do
              to=$(curl -s -o /dev/null -w '%{redirect_url}' -A "$UA" "$S/get/$k/$os")
              case "$to" in https://github.com/zmardanian/*) ;; *) bad "/get/$k/$os redirects to '$to'"; continue;; esac
              c=$(curl -s -o /dev/null -w '%{http_code}' -I -L "$to"); [ "$c" = 200 ] && echo "ok   /get/$k/$os" || bad "/get/$k/$os -> $to answered $c"
            done
          done
          c=$(curl -s -o /dev/null -w '%{http_code}' -A "$UA" -X POST --data 'email=check%40example.com&message=automated+site+check' "$S/contact/send")
          [ "$c" = 403 ] && echo "ok   contact form refuses a post without the spam check" || bad "contact form answered $c (expected 403)"
          curl -s -A "$UA" "$S/contact/" | grep -q 'class="cf-turnstile"' && echo "ok   Turnstile on the contact page" || bad "Turnstile missing on /contact/"
          curl -s -A "$UA" "$S/robots.txt" | grep -q '^Content-Signal: search=yes, ai-input=yes, ai-train=no' && echo "ok   robots.txt AI policy" || bad "robots.txt AI policy missing"
          exit $fail
